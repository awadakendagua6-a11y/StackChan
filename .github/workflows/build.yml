name: Build StackChan Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dependencies
        working-directory: firmware
        run: python3 fetch_repos.py

      - name: Build firmware
        working-directory: firmware
        run: |
          docker run --rm             -v "$PWD":/project             -w /project             espressif/idf:v5.5.4             bash -c "idf.py build && python -m esptool --chip esp32s3 merge_bin -o build/merged-binary.bin --flash_mode dio --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x20000 build/stackchan.bin"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-original-firmware
          path: firmware/build/merged-binary.bin
